name: CI

# Quality gates on every PR, and continuous deployment of both Workers when main moves.
# The deploy jobs are gated on `needs`, so nothing reaches production unless typecheck,
# lint, unit tests, the build, and the e2e suite all pass on that exact commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded PR runs are pointless, so cancel them. Pushes to main are not cancelled:
# each one deploys, and killing a half-finished deploy mid-flight is worse than queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Playwright reads this for retries; Vite/wrangler pick up the usual CI heuristics from it too.
  CI: "true"

jobs:
  build:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # action-setup must precede setup-node: setup-node's `cache: pnpm` needs pnpm on PATH.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Unit suites only — the web app's `test` script is the Playwright e2e run, which
      # lives in its own job so browser download time doesn't gate this feedback.
      - run: pnpm test:unit

      # Builds packages in dependency order (engine → collab-client → react) then the web app,
      # which is what the deploy jobs and the npm release both rely on compiling cleanly.
      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cache the browser binaries against the resolved Playwright version rather than the
      # lockfile hash, so unrelated dependency bumps don't force a fresh ~100MB download.
      - id: playwright-version
        run: echo "version=$(pnpm --filter @deviva-draw/web exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @deviva-draw/web exec playwright install --with-deps chromium

      # The cache holds the browser but not the apt-level system libraries it links against,
      # so those still need installing on a hit.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @deviva-draw/web exec playwright install-deps chromium

      # playwright.config.ts starts the Vite dev server itself; in-repo packages compile from
      # TypeScript source through Vite, so no build step is needed first.
      - run: pnpm --filter @deviva-draw/web test

      # playwright.config.ts sets `trace: on-first-retry` and no html reporter, so the
      # artifact worth keeping is test-results/ — it holds the trace zips for whatever
      # failed. Nothing useful is produced on a green run, hence failure() rather than
      # always(); playwright-report/ is listed in case an html reporter is added later.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  mcp-package:
    name: MCP package (pack smoke, SVG-only mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The optional native canvas must never be load-bearing: the whole suite has to stay green
      # with it disabled (canvas-dependent tests skip; export_png degrades to a clear error).
      - run: DEVIVA_MCP_NO_CANVAS=1 pnpm --filter @deviva-draw/mcp test

      # Live-session bridge against the REAL relay: wrangler dev (miniflare DO) + actual Node
      # WebSockets. Opt-in via env so local `pnpm test` stays fast; retried once because wrangler
      # cold-start is occasionally flaky in CI — a second consecutive failure is a real failure.
      - run: |
          DEVIVA_MCP_INTEGRATION=1 pnpm --filter @deviva-draw/mcp exec vitest run src/live/live-relay.integration.test.ts \
            || DEVIVA_MCP_INTEGRATION=1 pnpm --filter @deviva-draw/mcp exec vitest run src/live/live-relay.integration.test.ts
        name: Live-relay integration (wrangler dev)

      # Cold-start smoke against the PACKED artifacts — the exact thing `npx @deviva-draw/mcp`
      # installs: publishConfig-rewritten dist, bin + shebang, engine resolved as a real dependency
      # (its tarball installed alongside, since a tag may ship both at new versions together).
      - run: pnpm run build:packages
      - run: |
          set -eu
          SMOKE="$(mktemp -d)"
          pnpm --dir packages/engine pack --pack-destination "$SMOKE"
          pnpm --dir packages/collab-client pack --pack-destination "$SMOKE"
          pnpm --dir packages/mcp pack --pack-destination "$SMOKE"
          cd "$SMOKE"
          npm init -y > /dev/null
          npm install ./deviva-draw-engine-*.tgz ./deviva-draw-collab-client-*.tgz ./deviva-draw-mcp-*.tgz --no-audit --no-fund --loglevel=error
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | npx --no-install deviva-draw-mcp | grep -q '"serverInfo"'
        name: Pack + npx cold-start smoke

      # Publish dry-run on the workspace, so a broken files/exports/publishConfig setup fails a PR
      # instead of the immutable tag build.
      - run: pnpm --dir packages/mcp publish --dry-run --no-git-checks

      # Remote-worker bundle guard: the stateless Worker must stay canvas-free AND must not inline
      # the ~33KB base64 hand-drawn font (only the PNG path needs it; the SVG path tree-shakes it).
      # `d09GMg` is the woff2 magic in base64 — its presence means tree-shaking regressed.
      - run: |
          pnpm --dir apps/mcp-worker exec wrangler deploy --dry-run --outdir /tmp/mcp-worker-bundle
          if grep -q "d09GMg" /tmp/mcp-worker-bundle/index.js; then
            echo "::error::hand-drawn font data leaked into the mcp-worker bundle (tree-shaking regressed)"
            exit 1
          fi
        name: Worker bundle guard (size + font tree-shake)

  deploy-collab-server:
    name: Deploy collab server
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://collab-draw.deviva.app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Backend first: the web app talks to this origin, so on a release that changes both,
      # the API should be live before the new frontend starts calling it.
      #
      # `run` is required, not stylistic: `pnpm deploy` is a built-in pnpm command that copies a
      # workspace package into a directory, and it shadows the package's own deploy script.
      - run: pnpm --filter @deviva-draw/collab-server run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-mcp-worker:
    name: Deploy MCP worker
    needs: [build, e2e, mcp-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mcp-draw.deviva.app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `run` (not bare `pnpm deploy`) — same shadowing caveat as the collab job above.
      - run: pnpm --filter @deviva-draw/mcp-worker run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: Deploy web app
    needs: [build, e2e, deploy-collab-server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://draw.deviva.app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `run deploy` here is `vite build && wrangler deploy` — see the note on the collab job for why
      # the `run` matters. The build reads apps/web/.env.production for VITE_SHARE_API_BASE_URL,
      # which is committed, so no secret is needed for it.
      - run: pnpm --filter @deviva-draw/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-docs:
    name: Deploy docs site
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://docs-draw.deviva.app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The docs site imports @deviva-draw/react (live canvas demos) and generates the API
      # reference from both packages' source, so the packages must be built first.
      - run: pnpm build:packages

      # `run deploy` is `astro build && wrangler deploy` — see the collab job's note on why
      # bare `pnpm deploy` would shadow the package script.
      - run: pnpm --filter @deviva-draw/docs run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
