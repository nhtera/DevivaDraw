[package]
name = "deviva-draw-desktop"
version = "0.11.2"
description = "Deviva Draw desktop shell (Tauri v2)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# LAN relay (`src/lan_relay/`) — hosting a collaboration room on the local network.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
if-addrs = "0.13"

[profile.release]
codegen-units = 1
lto = true
strip = true
