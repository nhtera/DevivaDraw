<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover makes env(safe-area-inset-*) non-zero on notched devices; maximum-scale=1
         stops iOS Safari's auto-zoom on input focus (user pinch-zoom stays available — iOS ignores
         the cap for user-initiated zoom, so accessibility is preserved). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="description" content="Deviva Draw — an open-source, infinite-canvas whiteboard. A child project of Deviva." />
    <title>Deviva Draw</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
